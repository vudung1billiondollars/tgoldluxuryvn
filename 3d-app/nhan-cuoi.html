<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080605">
<title>Tự thiết kế nhẫn cưới · Bản thử 3D | T Gold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Be+Vietnam+Pro:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Pinyon+Script&display=swap">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="viewer3d.css">
<link rel="stylesheet" href="tu-thiet-ke.css">
</head>
<body>
<header class="top"><span class="logo">T GOLD</span><span class="tag">Tự thiết kế nhẫn cưới</span></header>
<main class="shell">
  <div class="stage">
    <div class="frame">
      <div id="viewer"></div>
      <div class="mark" aria-hidden="true"><span class="stamp" id="stamp">18K</span><span class="spec"><b id="spec-metal"></b><span id="spec-stone"></span></span></div>
      <div class="focus" id="focus" role="group" aria-label="Xem nhẫn"><button type="button" data-focus="pair" aria-pressed="true">Cả đôi</button><button type="button" data-focus="w" aria-pressed="false" aria-label="Nhẫn nữ"><span class="lg">Nhẫn nữ</span><span class="sm">Nữ</span></button><button type="button" data-focus="m" aria-pressed="false" aria-label="Nhẫn nam"><span class="lg">Nhẫn nam</span><span class="sm">Nam</span></button></div>
    </div>
  </div>
  <section class="pane" aria-labelledby="t">
    <div class="pane-head">
      <p class="kick">Tự thiết kế · Nhẫn cưới</p>
      <h1 id="t">Đôi nhẫn <em>của hai bạn.</em></h1>
    </div>
    <nav class="steps" id="steps" role="tablist" aria-label="Các bước thiết kế"></nav>
    <div class="pane-body" id="cfg" role="tabpanel"></div>
  </section>
</main>
<script type="module" src="nhan-cuoi.js"></script>
</body>
</html>
